# Entorno de liberación/despliegue. El mismo archivo sirve para staging y production;
# lo que cambia se define en environments/<entorno>.env (puertos, límites, retención).
# Se invoca siempre a través de scripts/env/provision.sh y scripts/deploy/deploy.sh.

services:
  app:
    image: ${APP_IMAGE:-talaverashop:none}
    restart: unless-stopped
    environment:
      PORT: "3000"
      APP_ENV: ${ENV_NAME:-staging}
      APP_VERSION: ${APP_VERSION:-dev}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "${APP_PORT:-8081}:3000"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: ${APP_MEM_LIMIT:-256m}
    cpus: ${APP_CPUS:-0.5}
    stop_grace_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=${PROM_RETENTION:-15d}
    volumes:
      - ${PROM_CONFIG_DIR:-./prometheus}:/etc/prometheus:ro
      - prometheus-data:/prometheus
    ports:
      - "${PROM_PORT:-9091}:9090"
    depends_on:
      - app

  grafana:
    image: grafana/grafana:11.3.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin-cambiar}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    depends_on:
      - prometheus

volumes:
  prometheus-data:
  grafana-data:
